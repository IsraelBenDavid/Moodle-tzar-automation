<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moodle Extension Tzar</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Moodle Extension Tzar</h1>
      <p class="subtitle">Assignment Extension Automation</p>
    </header>

    <!-- Settings Section -->
    <section id="settings-section" class="section">
      <div class="section-header" id="settings-toggle">
        <span class="section-title">Settings</span>
        <span class="toggle-icon" id="settings-icon">&#9660;</span>
      </div>
      <div class="section-body" id="settings-body">
        <div class="model-selection">
          <label class="section-title">AI Model:</label>
          <div class="model-options">
            <input type="radio" id="model-anthropic" name="ai-model" value="anthropic" checked>
            <label for="model-anthropic">Anthropic Claude</label>
            <input type="radio" id="model-openai" name="ai-model" value="openai">
            <label for="model-openai">OpenAI GPT</label>
            <input type="radio" id="model-gemini" name="ai-model" value="gemini">
            <label for="model-gemini">Google Gemini</label>
          </div>
        </div>

        <label for="api-key-input">API Key:</label>
        <div class="input-group">
          <input type="password" id="api-key-input" placeholder="sk-ant-..." autocomplete="off">
          <button id="toggle-key-visibility" class="icon-btn" title="Toggle visibility">&#128065;</button>
        </div>
        <button id="save-api-key" class="btn btn-primary">Save API Key</button>
        <div id="api-key-status" class="status-msg"></div>
      </div>
    </section>

    <!-- Scan Section -->
    <section id="scan-section" class="section">
      <button id="scan-forum-btn" class="btn btn-primary btn-full">
        <span id="scan-btn-text">Scan Forum</span>
        <span id="scan-spinner" class="spinner hidden"></span>
      </button>
      <div id="scan-status" class="status-msg"></div>
    </section>

    <!-- Direct Extension Section (shown when viewing a specific forum discussion) -->
    <section id="direct-extension-section" class="section hidden">
      <div class="section-header">
        <span class="section-title">Direct Extension</span>
      </div>
      <div class="section-body">
        <div id="direct-student-label" class="direct-student-label"></div>
        <div id="direct-deadline-info" class="deadline-info"></div>
        <input type="text" id="direct-assignment-name" placeholder="Assignment name (auto-detect if blank)">
        <div class="action-controls">
          <select id="direct-days-select">
            <option value="3">3 Days</option>
            <option value="4">4 Days</option>
            <option value="7">7 Days</option>
            <option value="custom">Other...</option>
          </select>
          <input type="number" id="direct-custom-days" class="custom-days-input hidden" value="3" min="1">
          <span class="time-separator">at</span>
          <input type="time" id="direct-time-override" title="Override submission time (leave blank to keep original)">
          <button id="direct-grant-btn" class="btn btn-approve">Grant Extension</button>
        </div>
        <div class="custom-reply-row">
          <label class="custom-reply-toggle-label">
            <input type="checkbox" id="direct-custom-reply-toggle"> Custom reply
          </label>
          <textarea id="direct-custom-reply-text" class="custom-reply-textarea hidden" rows="3" dir="rtl" placeholder="Custom reply message..."></textarea>
        </div>
        <div id="direct-extension-status" class="actions"></div>
      </div>
    </section>

    <!-- Results Section -->
    <section id="results-section" class="section hidden">
      <div class="section-header">
        <span class="section-title">Extension Requests</span>
        <span id="request-count" class="badge">0</span>
      </div>
      <div id="requests-list" class="requests-list"></div>
    </section>

    <!-- Error Display -->
    <div id="error-banner" class="error-banner hidden"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
